[project]
name = "flexiv-steward"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "da.yang", email = "da.yang@flexiv.com" }
]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
]

[project.scripts]
fs = "flexiv_steward:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/flexiv_steward"]
pretty = true
show_error_codes = true
